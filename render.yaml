# Render Blueprint — hosting aplikasi PHP (database ada di Supabase).
# Render → New → Blueprint → pilih repo ini. Setiap push ke main otomatis di-deploy ulang.
services:
  - type: web
    name: management-hub
    runtime: docker
    plan: free
    region: singapore
    branch: main
    healthCheckPath: /login.php
    envVars:
      # Connection string Supabase (Session pooler) lengkap dengan password — diisi di dashboard Render
      - key: DATABASE_URL
        sync: false
